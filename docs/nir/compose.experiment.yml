name: kis-nir

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: crm_nir
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ne zadan v .env}
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
    ports:
      - 127.0.0.1:55432:5432
    volumes:
      - nir-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${POSTGRES_USER:-crm} -d crm_nir"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: crm_nir
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ne zadan v .env}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?ne zadan v .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?ne zadan v .env}
      TZ: Europe/Moscow
      API_PORT: 3000
      COOKIE_SECURE: "false"
      LOGIN_RATE_LIMIT: 200
      RATE_LIMIT_DISABLED: ${NIR_RATE_LIMIT_DISABLED:-false}
      UPLOADS_DIR: /app/uploads
    volumes:
      - nir-uploads:/app/uploads
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 20s

  web:
    build:
      context: ../..
      dockerfile: web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 127.0.0.1:8181:80

volumes:
  nir-db:
  nir-uploads:
