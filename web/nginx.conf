# Заголовки безопасности вынесены в security-headers.conf и подключаются
# в каждом location: директива add_header во вложенном блоке отменяет все
# заголовки, унаследованные от родителя, поэтому задать их один раз
# на весь сервер нельзя.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Проксирование запросов API на backend-контейнер
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Выгрузки отчётов могут формироваться дольше обычного запроса
        proxy_read_timeout 120s;

        include /etc/nginx/security-headers.conf;
        # Ответы API не кэшируются: это всегда актуальные данные
        add_header Cache-Control "no-store" always;
    }

    # Файлы сборки содержат хеш в имени и не меняются
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA: любой неизвестный путь отдаёт index.html (клиентский роутинг).
    # Сам index.html кэшировать нельзя — после пересборки он ссылается
    # на новые файлы, и из кэша пользователь получил бы белый экран
    location / {
        try_files $uri $uri/ /index.html;

        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
