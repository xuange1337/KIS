# Базовый набор заголовков безопасности.
# Подключается в каждом location: nginx не наследует add_header во вложенные
# блоки, если в них есть собственные директивы add_header.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;

# Приложение самодостаточно: внешние скрипты, стили и шрифты не подключаются,
# данные запрашиваются только у собственного API
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
